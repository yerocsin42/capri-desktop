<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Bring Capri back to life on your desktop! :)">
  <title>Capri</title>
  <link rel="icon" type="image/x-icon" href="assets/chip.ico">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="header">
      <img class="chip" src="assets/chip.png" alt="Capri's chip" width="72" height="50">
      <div class="links">
        <a id="install" class="download" href="https://github.com/yerocsin42/capri-desktop/releases/download/v0.1.0/Capri-Setup.exe"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg><span>Download</span></a>
        <a class="github" href="https://github.com/yerocsin42/capri-desktop" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.62 1.22 3.26.93.1-.73.39-1.22.71-1.5-2.5-.29-5.13-1.25-5.13-5.57 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.83 10.83 0 0 1 5.64 0c2.15-1.45 3.1-1.15 3.1-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.33-2.64 5.28-5.15 5.56.4.35.76 1.03.76 2.08v3.11c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"/></svg></a>
      </div>
    </header>
    <main>
      <h1>Bring Capri <em>back</em> to life on your desktop! :)</h1>
      <div id="demo" class="demo" role="region" aria-label="Interactive browser demonstration of Capri">
        <button id="demo-capri" class="demo-capri" aria-label="Capri. Drag to move, click to react, or use arrow keys and Enter."><img src="assets/capri.png" alt="" width="220" height="220" draggable="false"></button>
        <div id="demo-menu" class="demo-menu" role="menu" aria-label="Capri controls" hidden>
          <button type="button" role="menuitem" data-action="hide">Hide Capri</button>
          <button type="button" role="menuitem" data-action="size">Size</button>
          <button type="button" role="menuitemcheckbox" aria-checked="true" data-action="motion">Motion <span aria-hidden="true">&#10003;</span></button>
        </div>
        <button id="demo-restore" class="restore" type="button" aria-label="Bring Capri back" title="Bring Capri back"><img src="assets/chip.png" alt="" width="36" height="25"></button>
        <div id="player-cursor" class="player-cursor" aria-hidden="true"><svg viewBox="0 0 28 34"><path d="M3 2v24l6-6 5 11 5-2-5-10h10L3 2Z"/></svg></div>
        <span id="demo-status" class="sr-only" role="status"></span>
      </div>
    </main>
  </div>
</body>
</html>
